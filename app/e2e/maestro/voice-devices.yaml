# aiwb-e2e: needs=server,agent,control,voice app=1
# voice-devices (voice devices, package D13, goal 6.5, architecture §12.4): what Settings > Voice shows and keeps of the audio devices on the iPhone layout, on the
# iOS simulator, against the stand-in voice service (no ElevenLabs, no key of value). Run it on your own simulator:
#   node app/e2e/run.mjs voice-devices --platform ios --device <udid> [--build]
# or on the Android emulator (its lock held, `app/e2e/README.md`): `--platform android --device emulator-5554`. The steps that differ by platform are `runFlow`s with
# `when: platform: iOS` or `Android`: the system's permission dialog, and the Speaker row (a line on iOS; on Android 12+, the emulator's API 36, a picker with
# System default and the phone's speaker, and the note that a headset is used for both).
#
# PART 1 needs NO microphone (the simulator can run it where it cannot capture audio: CoreAudio in a simulator whose host session cannot open the Mac's microphone
# aborts the app when the engine starts, "Initialize: RPC timeout. Apparently deadlocked."). The scratch server is added and holds a chat. On the phone Settings > Voice
# is a pushed screen (the foot's gear opens it over Settings, `vs-screen`; `_voice-open.yaml`). With NO key (one an earlier run left is removed first) it is the
# card `vs-nokey-card` and nothing else: no Microphone or Speaker row, no test, and no microphone alert from opening Settings (the devices are listed only while their
# sheet is open). Then the stand-in's key is typed, tested and saved in the Add key sheet (`vs-key`, `vs-key-test`, Save in the head; `_voice-add-key.yaml`), the card goes
# and Advanced has the rows Microphone `vs-mic` and Speaker `vs-speaker`, each opening its own sheet that lists while open (`vs-device-sheet-mic` / `-speaker`, with the test inside):
#   1. the Microphone sheet lists "System default (<the system's input>)" and the built-in input, and no microphone alert comes from listing (goal 4.8);
#   2. the Speaker cell says System and its sheet says it follows the system (the platform allows no choice, goal 3.4/4.4): no choice for the microphone's "follows the
#      system" line (`vs-mic-system`), no note, no "neither" line;
#   3. Test speaker (in the Speaker sheet) plays the chime through the native player to its end (the dev line's `tested` count, read once the sheet is closed: the sheet covers the line);
#   4. picking the built-in input shows it in the Microphone cell, and it is kept over the app being closed and opened again (the saved choice; the key stays).
# PART 2 NEEDS A REAL MICROPHONE (a Mac whose microphone the session may open, or a real iPhone/iPad): Dictate puts up the system's microphone alert, Allow, the stand-in
# hears the chunks and the words come into the box; the dev line `voice-dev-devices` says `mic=builtIn` (the kind of the opened input, never a name; the saved
# built-in was found, so no notice); Test microphone, in the Microphone sheet, shows the level meter. On the simulator of a session that cannot open the microphone the run ends here, at the
# app's abort, and the runner also reports that the stand-in saw no transcription socket. Where the steps of PART 2 start is marked "---- PART 2".
# Loss, pause and a headset's pick are not here: the unit tests over the fake module prove the logic, and a person with a wired or Bluetooth headset on a real iPhone,
# iPad and Android phone proves the rest (final report).
# The flow leaves the device as it found it (System default, no key; the screen shows `vs-nokey-card` again), and starts by putting it so, so it runs again on a device an earlier run left half-way.
appId: ${APP_ID}
---
- runFlow: _open-app.yaml
- runFlow: _forget-servers.yaml
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /chat?name=Voice-chat&text=Say one short sentence.
- runFlow: _add-server.yaml
- takeScreenshot: d13-00-sidebar

# ---- Settings > Voice (the pushed screen): no key (one left by an earlier run is removed)
- runFlow: _voice-open.yaml
- runFlow:
    when:
      visible:
        id: "vs-key-row"
    commands:
      - runFlow: _voice-remove-key.yaml
# (no key: the screen is the card and nothing else -- no Advanced, no Microphone and Speaker, no test, no note, and nothing asked the system for the microphone)
- assertVisible:
    id: "vs-nokey-card"
- assertNotVisible:
    id: "vs-mic"
- assertNotVisible:
    id: "vs-speaker"
- assertNotVisible:
    id: "vs-speaker-system"
- assertNotVisible:
    id: "vs-mic-test"
- assertNotVisible:
    id: "vs-speaker-test"
- assertNotVisible:
    id: "vs-devices-note"
- assertNotVisible:
    id: "vs-devices-neither"
- assertNotVisible: ".*Would Like to Access the Microphone.*"
- assertNotVisible: "Allow .* to record audio\\?"
- takeScreenshot: d13-00a-nokey

# ---- the key (the stand-in's; no microphone yet): Advanced then has the Microphone and Speaker rows
- runFlow:
    file: _voice-add-key.yaml
    env:
      KEY: "sk_test_d13devicekey"
      SHOT: d13-00b-key
- scrollUntilVisible:
    element:
      id: "vs-mic"
- assertNotVisible:
    id: "vs-nokey-card"

# ---- the choices the platform allows: a microphone picker, and the speaker follows the system (the cell says System; its sheet has the line and the test)
# (first the choice an earlier run may have left: System default)
- runFlow:
    file: _voice-device-default.yaml
    env:
      CELL: "vs-mic"
      SHEET: "vs-device-sheet-mic"
      WORD: "Microphone"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "vs-speaker"
          text: "Speaker, System.*"
      - assertNotVisible:
          id: "vs-mic-system"
      - assertNotVisible:
          id: "vs-devices-neither"
      - assertNotVisible:
          id: "vs-devices-note"
# (listing the devices asked for no microphone permission, goal 4.8; and none was listed before a sheet was opened)
- assertNotVisible: ".*Would Like to Access the Microphone.*"
- assertNotVisible: "Allow .* to record audio\\?"
- takeScreenshot: d13-01-card

# ---- the Microphone sheet lists System default and the system's input; it holds the test, and the note of a shared headset only where the platform has one
- tapOn:
    id: "vs-mic"
- extendedWaitUntil:
    visible:
      id: "vs-device-sheet-mic"
    timeout: 30000
- assertVisible:
    id: "picker-row"
    text: "System default \\(.+\\)"
- assertVisible:
    id: "picker-row"
    index: 1
- assertVisible:
    id: "vs-mic-test"
- assertNotVisible: ".*Would Like to Access the Microphone.*"
- assertNotVisible: "Allow .* to record audio\\?"
- takeScreenshot: d13-02-menu
- tapOn:
    id: "picker-row"
    index: 1
- tapOn:
    id: "sheet-right"
- extendedWaitUntil:
    notVisible:
      id: "vs-device-sheet-mic"
    timeout: 30000
- assertVisible:
    id: "vs-mic"
    text: "Microphone, (?!System default).+"
- assertNotVisible: ".*not connected.*"
- takeScreenshot: d13-03-picked

# ---- the Speaker sheet: on iOS the line that the system decides, on Android 12+ (the emulator's API 36) System default and the phone's speaker, and the note that
# a headset is used for both; Test speaker is in it either way: the chime plays through the native player to its end (the dev line is read once the sheet is closed)
- scrollUntilVisible:
    element:
      id: "vs-speaker"
- tapOn:
    id: "vs-speaker"
- extendedWaitUntil:
    visible:
      id: "vs-device-sheet-speaker"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "vs-speaker-system"
          text: "Follows the system: headphones or a headset when connected, otherwise the speaker."
      - assertNotVisible:
          id: "vs-devices-note"
# (Android: first the choice an earlier run may have left, System default; then the listing, and the speaker is picked too)
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "picker-row"
          text: "System default.*"
      - assertNotVisible:
          id: "vs-speaker-system"
      - assertVisible:
          id: "vs-devices-note"
          text: "A headset is used for both listening and speaking while you talk to a chat."
      - assertVisible:
          id: "picker-row"
          text: "System default \\(.+\\)"
      - assertVisible:
          id: "picker-row"
          index: 1
      - takeScreenshot: d13-03a-speaker-menu
      - tapOn:
          id: "picker-row"
          index: 1
      - takeScreenshot: d13-03b-speaker-picked
- assertVisible:
    id: "vs-speaker-test"
- tapOn:
    id: "vs-speaker-test"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "sheet-right"
- extendedWaitUntil:
    notVisible:
      id: "vs-device-sheet-speaker"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "vs-speaker"
          text: "Speaker, (?!System default).+"
      - assertNotVisible: ".*not connected.*"
- extendedWaitUntil:
    visible:
      id: "voice-dev-devices"
      text: "mic=none tested=[1-9][0-9]*"
    timeout: 30000
- takeScreenshot: d13-04-tested

# ---- the choice is kept over the app being closed and opened again
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /voice/relaunch
- runFlow: _open-app.yaml
- runFlow: _voice-open.yaml
- scrollUntilVisible:
    element:
      id: "vs-mic"
- extendedWaitUntil:
    visible:
      id: "vs-mic"
      text: "Microphone, (?!System default).+"
    timeout: 30000
- assertNotVisible: ".*not connected.*"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "vs-speaker"
      - extendedWaitUntil:
          visible:
            id: "vs-speaker"
            text: "Speaker, (?!System default).+"
          timeout: 30000
      - assertNotVisible: ".*not connected.*"
- takeScreenshot: d13-05-kept

# ---- the key is already saved (Dictate needs it); back to the sidebar, no microphone yet
- runFlow: _voice-back.yaml

# ---- PART 2: NEEDS A REAL MICROPHONE (the saved built-in input is opened by Dictate; the dev line says its kind)
- extendedWaitUntil:
    visible: "Voice-chat.*"
    timeout: 90000
- tapOn: "Voice-chat.*"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- extendedWaitUntil:
    visible: "FAKE.*Say one short sentence."
    timeout: 60000
- runScript:
    file: _voice.js
    env:
      ROUTE: /script
      BODY: '[{"after":8,"partial":"hello"},{"after":16,"committed":"hello there"}]'
- runFlow: _voice-dictate.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*Would Like to Access the Microphone.*"
          timeout: 30000
      - takeScreenshot: d13-06-prompt
      - tapOn:
          text: "OK|Allow"
# (Android's runtime permission dialog is the system's: it has no app words, its allow button is "While using the app")
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Allow .* to record audio\\?"
          timeout: 30000
      - takeScreenshot: d13-06-prompt
      - tapOn:
          text: "While using the app"
- runFlow: _voice-close-sheet.yaml
- extendedWaitUntil:
    visible: "hello there"
    timeout: 60000
- assertVisible:
    id: "voice-dev"
    text: "voice-dev: phase=listening .*"
- assertVisible:
    id: "voice-dev-devices"
    text: "mic=builtIn tested=[0-9]+"
- assertNotVisible:
    id: "voice-notice"
- takeScreenshot: d13-07-dictating
- runFlow: _voice-dictate.yaml
- runFlow: _voice-close-sheet.yaml
- extendedWaitUntil:
    visible:
      id: "voice-dev"
      text: "voice-dev: phase=idle .*"
    timeout: 30000

# ---- PART 2: Test microphone shows the level of the chosen input (in the Microphone sheet)
- runFlow: _to-sidebar.yaml
- runFlow: _voice-open.yaml
- scrollUntilVisible:
    element:
      id: "vs-mic"
- tapOn:
    id: "vs-mic"
- extendedWaitUntil:
    visible:
      id: "vs-device-sheet-mic"
    timeout: 30000
- tapOn:
    id: "vs-mic-test"
- extendedWaitUntil:
    visible:
      id: "vs-mic-level"
    timeout: 30000
- takeScreenshot: d13-08-meter
- tapOn:
    id: "vs-mic-test"
- extendedWaitUntil:
    notVisible:
      id: "vs-mic-level"
    timeout: 30000
- tapOn:
    id: "sheet-right"
- extendedWaitUntil:
    notVisible:
      id: "vs-device-sheet-mic"
    timeout: 30000

# ---- the device is left as it was found: System default, no key
- runFlow:
    file: _voice-device-default.yaml
    env:
      CELL: "vs-mic"
      SHEET: "vs-device-sheet-mic"
      WORD: "Microphone"
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          file: _voice-device-default.yaml
          env:
            CELL: "vs-speaker"
            SHEET: "vs-device-sheet-speaker"
            WORD: "Speaker"
- runFlow: _voice-remove-key.yaml
# (no key again: the screen is back to its card)
- assertNotVisible:
    id: "vs-mic"
- takeScreenshot: d13-09-restored
