# aiwb-e2e: needs=server,agent,control app=1 report=1 verify=composer-chips xcuitest=chips then=composer-chips-gallery
# composer-chips (AD-83 flow 3, goal 7.4, package V3): the composer of a board chat in the real app, against a scratch Go server, on the
# phone layout. A board with a rectangle is made on the server (the runner's control API, lib/serverctl.mjs) and a chat on it; the app is
# given the server; the board is opened, the rectangle tapped (selected), the chat opened, and in its composer "Add selection" puts a chip
# of the selection into the message: typed around, the caret never stops inside it, Backspace takes it whole, the message is sent, and the
# server says what it holds. What the box holds after each step is what the app reports to the runner (`report=1`); the flow asks the
# runner to check it (`POST /check?name=`, app/e2e/verify/composer-chips.mjs) and waits for it to hold. On iOS the XCUITest bundle
# app/e2e/xcuitest/chips then sends the hardware keys (arrows, Shift+arrows, ⌘A/C/V/X, delete). The second part, composer-chips-gallery,
# is the box alone on its dev gallery (the cases of package K2).
appId: ${APP_ID}
---
- runFlow: _open-app.yaml
- runFlow: _forget-servers.yaml
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /board?name=Chips-board&scene=chips
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /chat?name=Chips-chat&board=${output.ctl.id}
- runFlow: _add-server.yaml
- extendedWaitUntil:
    visible: "Chips-board"
    timeout: 60000
- takeScreenshot: v3-00-sidebar
- tapOn: "Chips-board"
- extendedWaitUntil:
    visible:
      id: "board-view"
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: "canvas-empty"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: v3-01-board
# ---- the rectangle is selected with a tap, and the chat of the board opened over the board (the board stays under it with its selection)
- tapOn:
    point: "38%,30%"
- takeScreenshot: v3-02-selected
- tapOn:
    id: "board-chats"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: v3-03-chat
# Where the chip is drawn, as percentages of the screen (Maestro taps points): the first line of the box with the keyboard up, "Move <chip> to"
# (the chip from 15% to 42% of the width, its “API” at 37%) and "ab <chip> cd" (the chip from 11%, its “API” at 33%); the box is on the line at
# 44% of the iPhone 16e's screen with its keyboard up. Medium Phone API 36.1 (1080x2400, Gboard up): the chip from 14% to 38%, the line at 52%. A tap on a word puts the platform's caret at the word's end, so the left tap is on the chip's leading edge.
- runFlow:
    when:
      platform: iOS
    commands:
      - evalScript: ${output.at_left = "17%,44%"}
      - evalScript: ${output.at_right = "37%,44%"}
      - evalScript: ${output.at_word = "33%,44%"}
      - evalScript: ${output.at_past = "75%,44%"}
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: ${output.at_left = "16%,52%"}
      - evalScript: ${output.at_right = "35%,52%"}
      - evalScript: ${output.at_word = "30%,52%"}
      - evalScript: ${output.at_past = "75%,52%"}

# ---- "Add selection" puts a chip at the caret; type around it
- tapOn:
    id: "composer-input"
- inputText: "Move"
- tapOn: "Add 1 selected"
- inputText: "to"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: v3-04-chip
- runFlow:
    file: _check.yaml
    env:
      NAME: inserted

# ---- a tap on the chip's left half: the caret goes to its start; typing there is before the chip
- tapOn:
    point: ${output.at_left}
- runFlow:
    file: _check.yaml
    env:
      NAME: caret-at-chip-start
- inputText: "X"
- runFlow:
    file: _check.yaml
    env:
      NAME: x-before-chip
- eraseText: 1                                                           # the X, not the chip
- runFlow:
    file: _check.yaml
    env:
      NAME: inserted-again
- takeScreenshot: v3-05-typed
# ---- the right half: the caret goes to its end; typing there is after the chip
- tapOn:
    point: ${output.at_right}
- runFlow:
    file: _check.yaml
    env:
      NAME: caret-at-chip-end
- inputText: "Y"
- runFlow:
    file: _check.yaml
    env:
      NAME: y-after-chip

# ---- Backspace: the space after the chip, then the chip whole (the box is emptied first: the same Backspace takes the chip of what is left)
- tapOn:
    point: ${output.at_past}   # (the caret to the end of the text: Backspace takes what is before it)
- eraseText: 60
- runFlow:
    file: _check.yaml
    env:
      NAME: empty
- inputText: "a"
- tapOn: "Add 1 selected"
- runFlow:
    file: _check.yaml
    env:
      NAME: a-chip-space
- eraseText: 1
- runFlow:
    file: _check.yaml
    env:
      NAME: a-chip
- eraseText: 1
- runFlow:
    file: _check.yaml
    env:
      NAME: a-only
- takeScreenshot: v3-05-backspace

# ---- a double tap in a chip selects it whole; typing over it replaces it; a single tap inside it puts the caret on an edge
- tapOn:
    point: ${output.at_past}   # (the caret to the end of the text: Backspace takes what is before it)
- eraseText: 10
- inputText: "ab"
- tapOn: "Add 1 selected"
- inputText: "cd"
- runFlow:
    file: _select-chip.yaml
    env:
      AT: ${output.at_word}
- runFlow:
    file: _check.yaml
    env:
      NAME: chip-selected
- inputText: "Z"
- runFlow:
    file: _check.yaml
    env:
      NAME: chip-replaced
- tapOn:
    point: ${output.at_past}   # (the caret to the end of the text: Backspace takes what is before it)
- eraseText: 10
- inputText: "ab"
- tapOn: "Add 1 selected"
- inputText: "cd"
- tapOn:
    point: ${output.at_word}
- runFlow:
    file: _check.yaml
    env:
      NAME: caret-at-an-edge

# ---- a line break (Enter is a line break on touch) and the send: the message goes with the chip, and the stand-in agent answers it
- tapOn:
    point: ${output.at_past}   # (the caret to the end of the text: Backspace takes what is before it)
- eraseText: 60
- inputText: "Move"
- tapOn: "Add 1 selected"
- inputText: "to"
- pressKey: Enter
- inputText: "thanks"
- takeScreenshot: v3-06-before-send
- runFlow:
    file: _check.yaml
    env:
      NAME: message
- tapOn:
    id: "send"
- runFlow:
    file: _check.yaml
    env:
      NAME: empty
- runFlow:
    file: _check.yaml
    env:
      NAME: server-has-message
      TIMEOUT: "60000"
- extendedWaitUntil:
    visible: "FAKE.*"
    timeout: 60000
- takeScreenshot: v3-07-sent
