# aiwb-e2e: needs=server,agent,control app=1 report=1 verify=composer-chips then=composer-chips-gallery
# composer-chips (AD-83 flow 3, goal 7.4, package V3): the composer of a board chat in the real app, against a scratch Go server. A board with a
# rectangle is made on the server (the runner's control API, lib/serverctl.mjs) and a chat on it; the app is given the server; the board is opened,
# the rectangle tapped (selected), the chat opened, the new chat's chip row and pickers shown (C2), and the selection put into the message:
#   phone (since B2): "+" › Add selection › the board's Add (`_chips-add-selection.yaml`) puts the reference beside the box as a chip of the context
#     row, not into the text; its × takes it out, and it is added again; the server's message holds it where the caret was (`_chips-phone.yaml`);
#   wide (iPad, tablet): the context row's "Add 1 selected" puts an inline chip, typed around, the caret never stops inside it, Backspace takes it
#     whole (`_chips-inline.yaml`); the XCUITest bundle app/e2e/xcuitest/chips (the hardware keys around that chip) belongs to this layout and is
#     no longer in the header, which the iPhone runs (package D1).
# The message is sent and the server says what it holds. What the box holds after each step is what the app reports to the runner (`report=1`);
# the flow asks the runner to check it (`POST /check?name=`, app/e2e/verify/composer-chips.mjs) and waits for it to hold. The second part,
# composer-chips-gallery, is the box alone on its dev gallery (the cases of package K2: inline chips under touch, on the phone too).
appId: ${APP_ID}
---
- runFlow: _open-app.yaml
- runFlow: _forget-servers.yaml
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /board?name=Chips-board&scene=chips
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /chat?name=Chips-chat&board=${output.ctl.id}
- runFlow: _add-server.yaml
# (the board's row: `home-row` on Home on the phone, labelled "<name>, <sub-line>", and the sidebar's tree on a tablet; one pattern finds both)
- extendedWaitUntil:
    visible: "Chips-board.*"
    timeout: 60000
- takeScreenshot: v3-00-home
- tapOn: "Chips-board.*"
- extendedWaitUntil:
    visible:
      id: "board-view"
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: "canvas-empty"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: v3-01-board
# (a window opens a board as a reader: the selection the chat takes is the writer's, so the bar's "Edit here" makes this window the writer first)
- tapOn:
    text: "Edit here"
    optional: true
- extendedWaitUntil:
    notVisible: "View only.*"
    timeout: 30000
- waitForAnimationToEnd
# ---- the rectangle is selected with a tap, and the chat of the board opened over the board (the board stays under it with its selection)
# (the phone opens a board fitted to its shapes (B1): the scene's rectangle fills 22 % to 78 % of the width and 44 % to 58 % of the height on the iPhone 17)
- tapOn:
    point: "38%,50%"
- takeScreenshot: v3-02-selected
- tapOn:
    id: "board-chats"
# (B1: on the phone the bar's Chats button opens the Chats sheet, whose row opens the chat; the tablet opens the chat beside the board)
- runFlow:
    when:
      visible:
        id: "chats-sheet"
    commands:
      - tapOn: "Chips-chat.*"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: v3-03-chat
# ---- the chat is new (no message yet): its chip row and the model and folder pickers (package C2), before the box is tapped. A chat with a chip row opens with its box unfocused (the
# keyboard down, the row in sight); the lowering is a no-op unless a keyboard is up. Phone only (the tablet's toolbar is the wide one).
- runFlow:
    when:
      visible:
        id: "composer-plus"
    commands:
      - runFlow: _ux-c1-lower.yaml
      - runFlow: _ux-c2-chips.yaml
# ---- the selection into the message, typed around: the phone's chip beside the box (B2), or the wide layouts' inline chip
- runFlow:
    when:
      visible:
        id: "composer-plus"
    commands:
      - runFlow: _chips-phone.yaml
- runFlow:
    when:
      notVisible:
        id: "composer-plus"
    commands:
      - runFlow: _chips-inline.yaml
- takeScreenshot: v3-06-before-send
- tapOn:
    id: "send"
- runFlow:
    file: _check.yaml
    env:
      NAME: empty
- runFlow:
    file: _check.yaml
    env:
      NAME: server-has-message
      TIMEOUT: "60000"
- extendedWaitUntil:
    visible: "FAKE.*"
    timeout: 60000
- takeScreenshot: v3-07-sent
