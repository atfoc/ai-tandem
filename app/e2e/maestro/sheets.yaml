# aiwb-e2e: needs=
# Package P1: sheets and overlays with the on-screen keyboard, on the real primitives of ui/ (src/dev/SheetsSelfTest.tsx), no server.
#  1. a sheet keeps the box that has the focus and its buttons above the keyboard: each button below is pressed while the keyboard is up
#     (under the keyboard, the press would land on a key and change nothing);
#  2. a menu, a dialog with a text box and a second sheet open from the sheet, declared beside it (-out) and inside it (-in): each shows
#     (on iOS a second Modal beside an open one does not) and is pressed;
#  3. the secret box does not make the system offer to save a password when the form closes;
#  4. (package rn-sw-nativekb) typing in the middle of the secret keeps the caret where the edit left it (iOS draws the secret as bullets and sets the box's
#     text from outside, which put the caret at the end): the text the form holds is read from `sheets-secret-value`;
#  5. (package rn-sw-nativekb) a popover hung from the bottom of the screen with an autofocused text box (the composer's model picker on the tablet layout) rises
#     with the keyboard: the box and its last row are above the keyboard's top (the app measures them against the keyboard's frame; its answer is the popover's first line, `geometry ok` or `geometry FAILED`) and
#     the last row is pressed with the keyboard up; a popover with more rows than the room that is left takes that room and its box is above the keyboard.
#  6. the composer's model picker and the library's insert popup as the app opens them: a real Overlay at the top of the screen (a sheet on the phone, a popover or a
#     dialog on the tablet) with an autofocused text box, opened with no keyboard (`toppop`, `topdlg`) and from a button over a text box that has the keyboard (`topkb`).
#     Nothing typed: the box is above the keyboard (`geometry ok`) and the screenshot shows the overlay; then one letter is typed and the screenshot is taken again
#     (what was seen was an overlay that showed only after the first key). Without the fix of `useKeyboardAvoid` (no LayoutAnimation) the failing step is the wait for
#     `sheets-<name>-input` (4 s, before the overlay's measure at 6 s, whose render would bring a lost sheet back): Maestro reads the native views and the sheet drawn
#     off-screen is not there, while `geometry ok` (the layout) was true even then. The sheet rises over 300 ms in these three, not 180 (`sheetTiming`): the sheet was lost
#     when the keyboard's LayoutAnimation was still running as its rise ended; the old code lost it at 180 and 300 ms every time and at 450 ms one time in nine
#     (iPhone simulator), so 300 ms puts the end of the rise in the middle of that window (toppop, topdlg and topkb: 5 of 5 each).
#     Run on a phone and on a tablet.
#  7. (ux-improvements package F1, the phone kit; the kit page of the self-test, `sheets-kit-open`):
#     a. detents: a `fit` ActionSheet (head, 4 rows, a destructive row) is at most half the window and a `large` Sheet starts at the safe area's top + 8 pt (within 2 pt);
#        both end at the window's bottom. The screen measures the sheet's surface and writes `fit ok: …` / `large ok: …` in the sheet's sub-line and, after it closed,
#        in `sheets-detent-fit` / `sheets-detent-large`; a row of the action sheet is pressed (it closes; `sheets-action` says which);
#     b. a FormSheet (P3) with two boxes rides the keyboard: with the second box focused and typed in, the box and the head's Save are above the keyboard's top
#        (`form ok`), and Save is pressed with the keyboard up (a press under it would hit a key); a dirty form's Cancel opens "Discard changes" over the form
#        (both on screen), its Cancel keeps the form and its text, and Discard changes closes both;
#     c. swipe rows: a finger swipe from the middle of row a shows Archive and Delete, Delete runs (`delete a`); a swipe to the left edge on row b runs the full
#        action (`archive b`); a long press runs the haptic (`long a`, `sheets-haptics: 1`; the simulator has no haptic engine, so what it shows is that expo-haptics
#        is linked: `haptics native: ok`, no red box); a swipe that starts inside the 20 pt edge opens nothing, the same swipe from 10 % of the width runs row c's
#        full action (`unarchive c`).
appId: ${APP_ID}
---
- runFlow: _open.yaml
- tapOn:
    id: "selftest-sheets"
- extendedWaitUntil:
    visible:
      id: "sheets-root"
    timeout: 30000
- tapOn:
    id: "sheets-open"
- extendedWaitUntil:
    visible:
      id: "sheets-title"
    timeout: 30000
- takeScreenshot: p1-00-sheet

# ---- 1: the keyboard is up for the last box and for the first, and the buttons below them are pressed with it up
- tapOn:
    id: "servers-input-name"
- inputText: "Studio"
- tapOn:
    id: "servers-input-address"
- inputText: "https://example.test:1"
- tapOn:
    id: "servers-input-secret"
- inputText: "abc"
- takeScreenshot: p1-01-keyboard-secret
- tapOn:
    id: "sheets-save"
- assertVisible: "log:.*saved Studio\\|https://example.test:1\\|abc.*"
- tapOn:
    id: "sheets-title"

# ---- 4: typing in the middle of the secret ("abc" is in it): the caret goes to the start, "XY" is typed there, so the caret must stay after the X
- assertVisible:
    id: "sheets-secret-value"
    text: "secret: abc"
- tapOn:
    id: "servers-input-secret"
    point: "1%,50%"
- inputText: "XY"
- assertVisible:
    id: "sheets-secret-value"
    text: "secret: XYabc"
- pressKey: Backspace
- inputText: "Z"
- assertVisible:
    id: "sheets-secret-value"
    text: "secret: XZabc"
- takeScreenshot: p1-02-secret-middle
- tapOn:
    id: "sheets-title"

# ---- 2: a popup opened from the sheet shows and works, whether it is declared beside the sheet or inside it
- tapOn:
    id: "sheets-menu-out"
- extendedWaitUntil:
    visible:
      id: "sheets-menu-pick-out"
    timeout: 10000
- takeScreenshot: p1-03-menu-out
- tapOn:
    id: "sheets-menu-pick-out"
- assertVisible: "log:.*menu-out picked.*"
- tapOn:
    id: "sheets-menu-in"
- extendedWaitUntil:
    visible:
      id: "sheets-menu-pick-in"
    timeout: 10000
- tapOn:
    id: "sheets-menu-pick-in"
- assertVisible: "log:.*menu-in picked.*"

- tapOn:
    id: "sheets-dialog-out"
- extendedWaitUntil:
    visible:
      id: "servers-input-dialog-out"
    timeout: 10000
- tapOn:
    id: "servers-input-dialog-out"
- inputText: "n1"
- takeScreenshot: p1-04-dialog-out
- tapOn:
    id: "sheets-dialog-save-out"
- assertVisible: "log:.*dialog-out saved n1.*"
- tapOn:
    id: "sheets-dialog-in"
- extendedWaitUntil:
    visible:
      id: "servers-input-dialog-in"
    timeout: 10000
- tapOn:
    id: "servers-input-dialog-in"
- inputText: "n2"
- tapOn:
    id: "sheets-dialog-save-in"
- assertVisible: "log:.*dialog-in saved n2.*"

- tapOn:
    id: "sheets-sheet-out"
- extendedWaitUntil:
    visible:
      id: "sheets-second-close-out"
    timeout: 10000
- takeScreenshot: p1-05-sheet-out
- tapOn:
    id: "sheets-second-close-out"
- assertVisible: "log:.*sheet-out closed.*"
- tapOn:
    id: "sheets-sheet-in"
- extendedWaitUntil:
    visible:
      id: "sheets-second-close-in"
    timeout: 10000
- tapOn:
    id: "sheets-second-close-in"
- assertVisible: "log:.*sheet-in closed.*"

# ---- 3: the form closes with a typed secret in it, and the system does not offer to save a password
- tapOn:
    id: "sheets-done"
- extendedWaitUntil:
    visible: "sheet: closed"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Not Now"
    timeout: 8000
- assertNotVisible: "Save Password.*"
- assertNotVisible: "Not Now"
- assertVisible:
    id: "sheets-root"
- takeScreenshot: p1-06-closed

# ---- 5: a popover hung from the bottom of the screen, with a text box that has the focus
- tapOn:
    id: "sheets-bottom-open"
- extendedWaitUntil:
    visible:
      id: "sheets-bottom-input"
    timeout: 10000
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- assertVisible: "geometry ok.*"
- takeScreenshot: p1-07-bottom-popover
- tapOn:
    id: "sheets-bottom-last"
- assertVisible: "log:.*bottom last picked.*"
- tapOn:
    id: "sheets-tall-open"
- extendedWaitUntil:
    visible:
      id: "sheets-tall-input"
    timeout: 10000
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- assertVisible: "geometry ok.*"
- takeScreenshot: p1-08-tall-popover
- tapOn:
    id: "sheets-tall-row-1"
- assertVisible: "log:.*tall row 1 picked.*"
- assertNotVisible:
    id: "sheets-tall-input"

# ---- 6: toppop, a top-level Overlay of kind popover with an autofocused text box, opened with no keyboard up
- tapOn:
    id: "sheets-toppop-open"
- extendedWaitUntil:
    visible:
      id: "sheets-toppop-input"
    timeout: 4000
- takeScreenshot: p1-09-toppop-before-typing
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-toppop-geometry
- assertVisible: "geometry ok.*"
- inputText: "a"
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-toppop-after-typing
- tapOn:
    id: "sheets-toppop-row-1"
- assertVisible: "log:.*toppop row 1 picked.*"
- assertNotVisible:
    id: "sheets-toppop-input"

# ---- 6: topdlg, a top-level Overlay of kind dialog with an autofocused text box, opened with no keyboard up
- tapOn:
    id: "sheets-topdlg-open"
- extendedWaitUntil:
    visible:
      id: "sheets-topdlg-input"
    timeout: 4000
- takeScreenshot: p1-09-topdlg-before-typing
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-topdlg-geometry
- assertVisible: "geometry ok.*"
- inputText: "a"
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-topdlg-after-typing
- tapOn:
    id: "sheets-topdlg-row-1"
- assertVisible: "log:.*topdlg row 1 picked.*"
- assertNotVisible:
    id: "sheets-topdlg-input"

# ---- 6: topkb, the same Overlay (kind dialog) opened from a button over a text box that has the keyboard (the insert popup opened while the composer's box has the focus)
- tapOn:
    id: "sheets-topkb-box"
- inputText: "x"
- takeScreenshot: p1-09-topkb-keyboard-up
- tapOn:
    id: "sheets-topkb-open"
- extendedWaitUntil:
    visible:
      id: "sheets-topkb-input"
    timeout: 4000
- takeScreenshot: p1-09-topkb-before-typing
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-topkb-geometry
- assertVisible: "geometry ok.*"
- inputText: "a"
- extendedWaitUntil:
    visible: "geometry (ok|FAILED).*"
    timeout: 15000
- takeScreenshot: p1-09-topkb-after-typing
- tapOn:
    id: "sheets-topkb-row-1"
- assertVisible: "log:.*topkb row 1 picked.*"
- assertNotVisible:
    id: "sheets-topkb-input"

# ---- 7: the kit page (the phone kit of ux-improvements package F1)
- tapOn:
    id: "sheets-kit-open"
- extendedWaitUntil:
    visible:
      id: "sheets-kit-root"
    timeout: 10000
- assertVisible: "haptics native: ok"
- assertVisible: "sheets-haptics: 0"

# ---- 7a: a fit sheet (an ActionSheet) and a large sheet measure themselves
- tapOn:
    id: "sheets-fit-open"
- extendedWaitUntil:
    visible: "Rename…"
    timeout: 10000
- extendedWaitUntil:
    visible: "fit (ok|FAILED).*"
    timeout: 15000
- assertVisible: "fit ok.*"
- takeScreenshot: f1-01-fit
- tapOn: "Rename…"
- extendedWaitUntil:
    visible:
      id: "sheets-action"
      text: "action: rename"
    timeout: 10000
- assertNotVisible: "Rename…"
- assertVisible:
    id: "sheets-detent-fit"
    text: "fit ok.*"
- tapOn:
    id: "sheets-large-open"
- extendedWaitUntil:
    visible:
      id: "sheets-large-done"
    timeout: 10000
- extendedWaitUntil:
    visible: "large (ok|FAILED).*"
    timeout: 15000
- assertVisible: "large ok.*"
- takeScreenshot: f1-02-large
- tapOn:
    id: "sheets-large-done"
- extendedWaitUntil:
    visible:
      id: "sheets-detent-large"
      text: "large ok.*"
    timeout: 10000

# ---- 7b: a form sheet (P3) rides the keyboard, saves with it up, and guards a dirty close
- tapOn:
    id: "sheets-form-open"
- extendedWaitUntil:
    visible:
      id: "sheets-form-two"
    timeout: 10000
- assertVisible:
    id: "sheet-right"
    enabled: false
- tapOn:
    id: "sheets-form-two"
- inputText: "Second text"
- extendedWaitUntil:
    visible: "form (ok|FAILED).*"
    timeout: 15000
- assertVisible: "form ok.*"
- assertVisible:
    id: "sheet-right"
    enabled: true
- takeScreenshot: f1-03-form-keyboard
- tapOn:
    id: "sheet-right"
- extendedWaitUntil:
    visible:
      id: "sheets-form-state"
      text: "form: saved \\|Second text"
    timeout: 10000
- assertNotVisible:
    id: "sheet-right"
- tapOn:
    id: "sheets-form-open"
- extendedWaitUntil:
    visible:
      id: "sheets-form-one"
    timeout: 10000
- tapOn:
    id: "sheets-form-one"
- inputText: "draft"
- tapOn:
    id: "sheet-left"
- extendedWaitUntil:
    visible:
      id: "confirm-go"
    timeout: 10000
- assertVisible: "Discard changes"
# the form stays drawn under the confirm (the screenshot shows both); a modal layer hides what is under it from the accessibility tree, so it cannot be asserted
- takeScreenshot: f1-04-discard-over-form
- tapOn:
    id: "confirm-cancel"
- extendedWaitUntil:
    notVisible:
      id: "confirm-go"
    timeout: 10000
- assertVisible:
    id: "sheets-form-one"
    text: "draft"
- tapOn:
    id: "sheet-left"
- extendedWaitUntil:
    visible:
      id: "confirm-go"
    timeout: 10000
- tapOn:
    id: "confirm-go"
- extendedWaitUntil:
    visible:
      id: "sheets-form-state"
      text: "form: discarded"
    timeout: 10000
- assertNotVisible:
    id: "sheet-left"
- assertNotVisible:
    id: "confirm-go"

# ---- 7c: swipe rows (the rows are at 50 %, 57 % and 64 % of the window's height) and a long press
- takeScreenshot: f1-05-rows
- swipe:
    start: "50%, 50%"
    end: "10%, 50%"
    duration: 400
- extendedWaitUntil:
    visible: "Delete"
    timeout: 10000
- assertVisible: "Archive"
- takeScreenshot: f1-06-row-a-open
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "sheets-swipe-last"
      text: "delete a"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Delete"
    timeout: 10000
- swipe:
    start: "90%, 57%"
    end: "2%, 57%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "sheets-swipe-last"
      text: "archive b"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Archive"
    timeout: 10000
- longPressOn:
    id: "sheets-row-a"
- extendedWaitUntil:
    visible:
      id: "sheets-swipe-last"
      text: "long a"
    timeout: 10000
- assertVisible: "sheets-haptics: 1"
- assertVisible: "haptics native: ok"
# a swipe that starts inside the 20 pt edge opens nothing; from 10 % of the width the same swipe runs the full action
- swipe:
    start: "2%, 64%"
    end: "90%, 64%"
    duration: 400
- assertVisible:
    id: "sheets-swipe-last"
    text: "long a"
- assertNotVisible: "Unarchive"
- swipe:
    start: "10%, 64%"
    end: "90%, 64%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "sheets-swipe-last"
      text: "unarchive c"
    timeout: 10000
- takeScreenshot: f1-07-end
