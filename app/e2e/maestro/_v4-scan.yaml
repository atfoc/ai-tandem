# Part 4 of `storage-picker-permission`: the code to scan. scripts/server-code.sh makes the code of the scratch server (the runner's `POST /device/qr`: the real script, a
# `qrencode` that keeps what it is fed, the picture read back with CoreImage). Neither the iOS simulator nor the Android emulator can be shown the picture on its screen as a
# camera sees it (the simulator has no camera; the emulator's camera is a room it shows, and the stock walk to its poster does not move it here), so the scan itself is by hand
# (goal 7.5). What is shown here: the scanner's screen and the camera's permission, answered both ways, on both; then the text that the picture holds, which is the text a
# camera hands the app, is typed into the paste box that "Paste text instead" opens (the scanner and the paste go through the same parser): "New server" is filled, and the server it names answers with the
# fingerprint that text printed ("Matches the fingerprint in the code"); × closes the camera back to "Choose how". Starts on the sidebar. The servers an earlier part left are
# removed first: the add form refuses a server that is already in the list ("Already added as …", S2), and the code names the run's server.
appId: ${APP_ID}
---
- runFlow: _to-sidebar.yaml
- runFlow: _forget-servers.yaml
- runScript:
    file: _ctl.js
    env:
      METHOD: POST
      ROUTE: /device/qr
- evalScript: ${output.code = output.ctl}

# ---- iOS: the camera's permission was never asked (the picker's was no permission): the scanner asks, with the app's own words in the system's prompt; refused, the scanner says so
#      and gives the way to the settings; the answer is forgotten (the system's own reset), asked again and given: the scanner is on the screen (a simulator has nothing to see)
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/privacy?service=all&action=reset
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/relaunch
      - runFlow: _open-sidebar.yaml
      - runFlow: _add-choose.yaml
      - tapOn: "Scan QR code.*"
      - extendedWaitUntil:
          visible:
            id: "addserver-camera-allow"
          timeout: 30000
      - assertVisible: "The camera reads the code your server shows. Nothing is recorded or kept."
      - takeScreenshot: v4-40-scanner-asks
      - tapOn:
          id: "addserver-camera-allow"
      - extendedWaitUntil:
          visible: ".*would like to access the Camera.*"
          timeout: 30000
      - assertVisible: ".*uses the camera only to scan the code that your server shows.*"
      - takeScreenshot: v4-41-camera-prompt
      - tapOn: "Don.t Allow"
      - extendedWaitUntil:
          visible: "The camera is off for AI Whiteboard. Allow it in the settings to scan a code, or paste the text instead."
          timeout: 30000
      - assertVisible:
          id: "addserver-open-settings"
      - takeScreenshot: v4-42-camera-refused
      - tapOn:
          id: "add-scan-close"
      - extendedWaitUntil:
          visible: "Paste setup text.*"
          timeout: 30000
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/privacy?service=all&action=reset
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/relaunch
      - runFlow: _open-sidebar.yaml
      - runFlow: _add-choose.yaml
      - tapOn: "Scan QR code.*"
      - extendedWaitUntil:
          visible:
            id: "addserver-camera-allow"
          timeout: 30000
      - tapOn:
          id: "addserver-camera-allow"
      - extendedWaitUntil:
          visible: ".*would like to access the Camera.*"
          timeout: 30000
      - tapOn: "Allow"
      - extendedWaitUntil:
          notVisible:
            id: "addserver-camera-allow"
          timeout: 30000
      - assertVisible: "On the server, run server-code.sh. Its code holds the address, the secret and the certificate's fingerprint."
      - takeScreenshot: v4-43-camera-allowed

# ---- Android: the same. A first refusal can be asked again; a second one is for good, and the scanner then says the camera is off and gives the settings; the permission given
#      (as the settings give it: `pm grant`) the scanner is on the screen with the emulator's camera running
- runFlow:
    when:
      platform: Android
    commands:
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/privacy?service=camera&action=revoke
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/relaunch
      - runFlow: _open-sidebar.yaml
      - runFlow: _add-choose.yaml
      - tapOn: "Scan QR code.*"
      - extendedWaitUntil:
          visible:
            id: "addserver-camera-allow"
          timeout: 30000
      - assertVisible: "The camera reads the code your server shows. Nothing is recorded or kept."
      - takeScreenshot: v4-40-scanner-asks
      - tapOn:
          id: "addserver-camera-allow"
      - extendedWaitUntil:
          visible: "Allow AI Whiteboard to take pictures and record video\\?"
          timeout: 30000
      - takeScreenshot: v4-41-camera-prompt
      - tapOn: "Don.t allow"
      - extendedWaitUntil:
          visible:
            id: "addserver-camera-allow"
          timeout: 30000
      - tapOn:
          id: "addserver-camera-allow"
      - extendedWaitUntil:
          visible: "Allow AI Whiteboard to take pictures and record video\\?"
          timeout: 30000
      - tapOn: "Don.t allow"
      - extendedWaitUntil:
          visible: "The camera is off for AI Whiteboard. Allow it in the settings to scan a code, or paste the text instead."
          timeout: 30000
      - assertVisible:
          id: "addserver-open-settings"
      - takeScreenshot: v4-42-camera-refused
      - tapOn:
          id: "add-scan-close"
      - extendedWaitUntil:
          visible: "Paste setup text.*"
          timeout: 30000
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/privacy?service=camera&action=grant
      - runScript:
          file: _ctl.js
          env:
            METHOD: POST
            ROUTE: /device/relaunch
      - runFlow: _open-sidebar.yaml
      - runFlow: _add-choose.yaml
      - tapOn: "Scan QR code.*"
      - extendedWaitUntil:
          visible:
            id: "addserver-scan-words"
          timeout: 30000
      - assertNotVisible:
          id: "addserver-camera-allow"
      - assertVisible: "On the server, run server-code.sh. Its code holds the address, the secret and the certificate's fingerprint."
      - takeScreenshot: v4-43-camera-allowed
# "Paste text instead" leaves the camera for the paste step of "New server" (the clipboard is read on that press; the simulator's holds no setup text, so the box is there to paste into)
- tapOn:
    id: "add-scan-paste"
- tapOn:
    text: "Allow Paste"
    optional: true
- extendedWaitUntil:
    visible:
      id: "add-field-code"
    timeout: 30000
- assertNotVisible:
    id: "addserver-scan-words"
- takeScreenshot: v4-45-paste-after-the-scanner

# ---- the text of the code (what the scanner hands to the form)
- tapOn:
    id: "add-field-code"
- inputText: ${output.code.lines[0]}
# (the text is taken as soon as the lines typed so far read as a server's, and the box goes with the step: each later line is typed only while the box is there)
- runFlow:
    when:
      visible:
        id: "add-field-code"
    commands:
      - pressKey: Enter
      - inputText: ${output.code.lines[1]}
- runFlow:
    when:
      visible:
        id: "add-field-code"
    commands:
      - pressKey: Enter
      - inputText: ${output.code.lines[2]}
- runFlow:
    when:
      visible:
        id: "add-field-code"
    commands:
      - pressKey: Enter
      - inputText: ${output.code.lines[3]}
# (a line typed in one go is a paste to the box, and the text is taken at once, as Android's keyboard types a line: the button is for the text that was not)
- tapOn:
    id: "add-read"
    optional: true
- extendedWaitUntil:
    visible:
      id: "add-filled"
    timeout: 30000
- assertVisible: "✓ Filled in from the code. Check the name, then test."
- tapOn:
    id: "add-test"
- extendedWaitUntil:
    visible:
      id: "add-trust"
    timeout: 60000
- assertVisible:
    id: "add-match"
- assertVisible: ".*Matches the fingerprint in the code.*"
- takeScreenshot: v4-44-code-text-filled-the-form
# the person does not save: Cancel asks to discard what was typed, and the list is under the sheet; back to the sidebar
- tapOn: "Cancel"
- tapOn: "Discard changes"
- extendedWaitUntil:
    visible:
      id: "srv-add"
    timeout: 30000
- runFlow: _to-sidebar.yaml
