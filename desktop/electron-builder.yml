# Packages AI Whiteboard.app (run by scripts/build-app.sh, which builds the web build and the Go
# binary first). The app is Electron; the Go server binary sits next to it in Contents/MacOS, and
# the web build it shows (app/dist-web) is in Contents/Resources/web.
appId: local.ai-whiteboard
productName: AI Whiteboard
directories:
  output: dist
# Only the main process and the preload go into app.asar; electron-builder adds the runtime
# dependencies from package.json: electron-window-state, and the connection module @aiwb/conn
# (a file: dependency on ../packages/conn, packed as any other). The test host (web/dev) is not
# here: the app carries no code of it.
files:
  - main.js
  - preload.js
  - lib.js
  - ipcface.js
  - voice.js
  - package.json
asar: true
# Outside app.asar: a binary can't be run from inside an asar.
extraFiles:
  - from: build/ai-whiteboard
    to: MacOS/ai-whiteboard
extraResources:
  - from: ../app/dist-web
    to: web
  # Sets the app's own server up as a remote server; run through sh (scripts/remote).
  - from: ../scripts/remote/setup-remote.sh
    to: remote/setup-remote.sh
  - from: ../assets/icon/AppIcon.icns
    to: AppIcon.icns
  # The headless writer (scripts/build-app.sh builds it into build/headless): headless.mjs, manifest.json and engine/ with the
  # native canvas (engine/node_modules/skia-canvas/lib/skia.node). A resource, not part of app.asar: a native module can't be
  # loaded from an asar archive, and the server runs headless.mjs from this folder (asarUnpack would not give it a plain folder).
  # It is signed with the rest of the app (every Mach-O file in the bundle is).
  - from: build/headless
    to: headless
mac:
  target: dir
  icon: ../assets/icon/AppIcon.icns
  identity: "-" # ad-hoc: enough to run on this Mac
  hardenedRuntime: false
  # The microphone's prompt (voice): macOS shows this sentence, and without it the app cannot ask for the microphone.
  extendInfo:
    NSMicrophoneUsageDescription: AI Whiteboard uses the microphone only when you dictate or talk to a chat. Your voice goes to ElevenLabs with your own key.
