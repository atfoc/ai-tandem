<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Whiteboard</title>
<meta name="color-scheme" content="light dark">
<script>
  // The saved theme (localStorage "aiwb.theme"), set before the first paint so the page never
  // flashes the other one. Same rule as src/logic/theme.ts resolveTheme; theme.ts takes over.
  try {
    var t = localStorage.getItem("aiwb.theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/main.css">
<div id="root"></div>
<script type="module" src="/main.js"></script>
</html>
