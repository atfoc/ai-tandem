plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aiwbnet'
version = '0.1.0'

android {
  namespace "expo.modules.aiwbnet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The version React Native itself ships (react-native/gradle/libs.versions.toml), so that Gradle
  // resolves one OkHttp and the app does not pull in another.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
